<svg viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nolan-void" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="35%" stop-color="#070d1a"/>
      <stop offset="70%" stop-color="#0c182b"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>
    <linearGradient id="event-horizon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="30%" stop-color="#FF7B00"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="accretion-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.45)"/>
      <stop offset="50%" stop-color="rgba(255, 123, 0, 0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="500" height="750" fill="url(#nolan-void)"/>
  <circle cx="250" cy="320" r="220" fill="url(#accretion-glow)"/>

  <!-- Stars Background -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="45" cy="80" r="1.2"/>
    <circle cx="120" cy="140" r="0.8"/>
    <circle cx="390" cy="95" r="1.5"/>
    <circle cx="440" cy="220" r="1.0"/>
    <circle cx="70" cy="450" r="1.3"/>
    <circle cx="410" cy="510" r="0.9"/>
    <circle cx="290" cy="60" r="1.1"/>
    <circle cx="180" cy="220" r="0.7"/>
  </g>

  <!-- Accretion Disk / Event Horizon Ring -->
  <ellipse cx="250" cy="320" rx="190" ry="42" fill="none" stroke="url(#event-horizon)" stroke-width="4.5" filter="url(#bloom)" transform="rotate(-14 250 320)"/>
  
  <!-- Central Black Hole Singularity -->
  <circle cx="250" cy="320" r="76" fill="#000000" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.8"/>
  <ellipse cx="250" cy="320" rx="74" ry="74" fill="#010204"/>

  <!-- Solitary Odyssey Spacecraft Silhouette -->
  <g transform="translate(250, 318) rotate(35) scale(0.65)">
    <polygon points="0,-24 10,12 -10,12" fill="#E2E8F0"/>
    <polygon points="0,-18 30,16 10,12" fill="#94A3B8"/>
    <polygon points="0,-18 -30,16 -10,12" fill="#64748B"/>
    <!-- Ion Engine Plasma Glow -->
    <ellipse cx="0" cy="16" rx="4" ry="8" fill="#00E5FF" filter="url(#bloom)"/>
  </g>

  <!-- Christopher Nolan & Syncopy Presentation -->
  <text x="250" y="70" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="5">A FILM BY CHRISTOPHER NOLAN</text>
  <text x="250" y="88" font-family="'Outfit', sans-serif" font-weight="600" font-size="8.5" fill="#64748B" text-anchor="middle" letter-spacing="4">SYNCOPY FILMS PRODUCTION</text>

  <!-- Cinematic Framing Line -->
  <line x1="80" y1="102" x2="420" y2="102" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

  <!-- Bottom Dark Gradient Plate -->
  <rect y="560" width="500" height="190" fill="url(#nolan-void)" opacity="0.95"/>

  <!-- Title Typography -->
  <text x="250" y="625" font-family="'Outfit', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">THE ODYSSEY</text>
  <text x="250" y="652" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" fill="#00E5FF" text-anchor="middle" letter-spacing="6">SHOT ON 70MM IMAX FILM</text>

  <!-- Release & Attribution -->
  <text x="250" y="695" font-family="sans-serif" font-weight="600" font-size="10.5" fill="#E2E8F0" text-anchor="middle" letter-spacing="3">IN THEATRES 2026</text>
  <text x="250" y="718" font-family="sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle" letter-spacing="2">EXPERIENCE IT IN IMAX 70MM &amp; P[XL]</text>
</svg>
